<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Maqam between AI agents and enterprise tools</title>
  <desc id="desc">An agent proposes an action. Maqam checks policy, binds approval to the exact input and allows one registered execution. The result produces a receipt. Changed input and replay are rejected.</desc>
  <defs>
    <linearGradient id="ground" x2="1" y2="1"><stop stop-color="#111e19"/><stop offset=".6" stop-color="#080e0b"/><stop offset="1" stop-color="#101b15"/></linearGradient>
    <linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#1b3329"/><stop offset="1" stop-color="#0d1913"/></linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1400" y2="0"><stop stop-color="#33705b"/><stop offset=".5" stop-color="#6ee3b8"/><stop offset="1" stop-color="#33705b"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#36c292" stop-opacity=".15"/><stop offset="1" stop-color="#36c292" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#355142" stroke-opacity=".13"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6" fill="none" stroke="#74ddb6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1400" height="820" fill="url(#ground)"/>
  <rect width="1400" height="820" fill="url(#grid)"/>
  <ellipse cx="700" cy="425" rx="600" ry="375" fill="url(#light)"/>
  <g font-family="Arial, sans-serif" fill="#e9f3ed">
    <text x="700" y="105" text-anchor="middle" font-size="28" fill="#91aa9d">From intent to authorised action</text>
    <path d="M345 391H476M924 391H1055" fill="none" stroke="url(#edge)" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M700 572V644H1100" fill="none" stroke="#426854" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="92" y="272" width="253" height="238" rx="20" fill="#111d17" stroke="#334c3e"/>
    <g fill="none" stroke="#adbdaf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m194 329-20 17 20 17m47-34 20 17-20 17m-19-44-12 54"/></g>
    <text x="218" y="415" text-anchor="middle" font-size="31" font-weight="600">AI agent</text>
    <text x="218" y="453" text-anchor="middle" font-size="19" fill="#9cac9e">Proposed tool + input</text>
    <rect x="477" y="204" width="446" height="368" rx="24" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M505 247H895" stroke="#82dbb0" stroke-opacity=".25"/>
    <rect x="647" y="258" width="106" height="84" rx="13" fill="#152f23" stroke="#4a9872"/>
    <path d="M668 315v-31l32 23 32-23v31m-64 0h14m36 0h14" stroke="#a2efce" stroke-width="8" stroke-linejoin="round" fill="none"/>
    <text x="700" y="398" text-anchor="middle" font-size="53" font-weight="600" letter-spacing="-2">Maqam</text>
    <text x="700" y="434" text-anchor="middle" font-size="22" fill="#b1cbbd">The governance layer</text>
    <path d="M517 467H883" stroke="#385c47"/>
    <text x="700" y="505" text-anchor="middle" font-size="20" fill="#9de7c3">Policy · Exact approval · Single use</text>
    <text x="700" y="539" text-anchor="middle" font-size="18" fill="#a0b4a7">Checked before the registered handler runs</text>
    <rect x="1056" y="272" width="253" height="238" rx="20" fill="#111d17" stroke="#334c3e"/>
    <g fill="none" stroke="#adbdaf" stroke-width="3"><rect x="1154" y="322" width="58" height="45" rx="5"/><path d="M1154 333h58m-49 17h13m7 0h20"/></g>
    <text x="1182" y="415" text-anchor="middle" font-size="29" font-weight="600">Enterprise tools</text>
    <text x="1182" y="453" text-anchor="middle" font-size="19" fill="#9cac9e">Registered execution path</text>
    <rect x="1064" y="606" width="245" height="78" rx="12" fill="#12261c" stroke="#345b42"/>
    <text x="1186" y="654" text-anchor="middle" font-size="24" fill="#a2e8bd">Execution receipt</text>
    <path d="M490 656h300" stroke="#a07165" stroke-opacity=".7" stroke-dasharray="5 7"/>
    <circle cx="476" cy="656" r="12" fill="#422a25" stroke="#bd8c7a"/>
    <path d="m472 652 8 8m0-8-8 8" stroke="#d6a994" stroke-width="2"/>
    <text x="700" y="714" text-anchor="middle" font-size="20" fill="#b7a397">Changed input or replay requires fresh authority.</text>
    <text x="700" y="763" text-anchor="middle" font-size="18" fill="#799486">Only actions routed through Maqam are governed.</text>
  </g>
</svg>
